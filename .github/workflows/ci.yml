name: CI Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-checks:
    name: Backend Lint, Security & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Verify Code Style & Linting
        run: |
          cd backend
          python -m ruff check .

      - name: Run Backend Unit & API Tests
        run: |
          cd backend
          python -m pytest tests/unit tests/api -v

      - name: Validate Migration Scripts & Models
        run: |
          cd backend
          python -c "from app.models import Base; print('Model metadata successfully validated')"

  frontend-checks:
    name: Frontend Lint, Type Check & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Type Check (TypeScript strict)
        run: |
          cd frontend
          npm run type-check

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Production Build
        run: |
          cd frontend
          npm run build

  container-build-checks:
    name: Container Build & Reproducibility Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: supportgpt-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: supportgpt-frontend:ci-test

      - name: Build Nginx Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: false
          tags: supportgpt-nginx:ci-test
